name: CI

on:
  pull_request:
    branches: [dev, main, standalone]
  push:
    branches: [dev, main, standalone]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dockerfile linter (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine < Dockerfile

      - name: Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: docker build (tools, no keys needed)
        run: docker build --target tools -t ostrovok-tools .

      # The standalone demo builds from the snapshot of data/standalone: no keys.
      - name: docker build (app)
        run: docker build --target runner -t ostrovok-app .
