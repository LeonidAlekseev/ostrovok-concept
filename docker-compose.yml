# docker compose up --build  → http://localhost:8080. Keys: .env (cp .env.example .env, fill in the values or
# only AGE_SECRET_KEY); see README. The standalone demo: no database, the data are inside the image.
services:
  app:
    build:
      context: .
      target: runner
      secrets:
        - age_secret_key
    platform: linux/amd64
    env_file: .env
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # make seed: scripts of package.json against the cloud database; not started by `up`.
  tools:
    profiles: ['tools']
    build:
      context: .
      target: tools
    platform: linux/amd64
    env_file: .env

secrets:
  age_secret_key:
    environment: AGE_SECRET_KEY
