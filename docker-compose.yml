# docker compose up --build  → http://localhost:8080. The standalone demo: no database, no keys, the data are inside
# the image; see README.
services:
  app:
    build:
      context: .
      target: runner
    platform: linux/amd64
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # make seed: scripts of package.json against the cloud database; not started by `up`.
  tools:
    profiles: ['tools']
    build:
      context: .
      target: tools
    platform: linux/amd64
    env_file: .env
