# docker compose up --build  → http://localhost:3000. Keys: .env (env_file) or only AGE_SECRET_KEY; see README «Docker».
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      secrets:
        - age_secret_key
    env_file:
      - path: .env
        required: false
    environment:
      AGE_SECRET_KEY: ${AGE_SECRET_KEY:-}
    ports:
      - '3000:3000'
    restart: unless-stopped

secrets:
  age_secret_key:
    environment: AGE_SECRET_KEY
